app-id: io.github.Theneillsaaco.MediaPlayer
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
appstream-compose: false
command: media-player

add-build-extensions:
  org.freedesktop.Sdk.Extension.dotnet10:
    directory: lib/sdk/dotnet10
    version: '26.08'

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --share=ipc
  - --share=network
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.Notifications
  - --own-name=org.mpris.MediaPlayer2.Player
  - --own-name=org.mpris.MediaPlayer2.Player.*
  - --filesystem=xdg-run/dconf
  - --filesystem=~/.config/dconf:ro
  - --talk-name=ca.desktop.dconf
  - --env=DCONF_USER_CONFIG_DIR=.config/dconf
  - --env=PLAYER_SIDECAR_DIR=/app/share/player/sidecar
  - --env=QT_QUICK_CONTROLS_STYLE=Basic
  - --env=QtDir=/usr
  - --env=DOTNET_ROOT=/app/lib/dotnet
  # "Importar sesión del navegador" (solo lectura). Quita lo que no uses:
  #   flatpak override --user --nofilesystem=~/.mozilla io.github.Theneillsaaco.MediaPlayer
  - --filesystem=~/.mozilla:ro
  - --filesystem=~/.config/mozilla:ro
  - --filesystem=~/.var/app/org.mozilla.firefox:ro
  - --filesystem=~/.config/chromium:ro
  - --filesystem=~/.config/google-chrome:ro
  - --filesystem=~/.config/BraveSoftware:ro
  - --filesystem=~/.config/microsoft-edge:ro
  - --filesystem=~/.config/vivaldi:ro
  - --filesystem=~/.config/opera:ro

build-options:
  build-args:
    - --share=network
  append-path: /app/lib/sdk/dotnet10/bin:/usr/lib/sdk/dotnet10/bin
  append-ld-library-path: /app/lib/sdk/dotnet10/lib:/usr/lib/sdk/dotnet10/lib
  append-pkg-config-path: /app/lib/sdk/dotnet10/lib/pkgconfig:/usr/lib/sdk/dotnet10/lib/pkgconfig  
  
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - /share/doc
  - '*.a'
  - '*.la'

modules:
  - name: ffmpeg
    config-opts:
      - --enable-shared
      - --disable-static
      - --disable-programs
      - --disable-doc
      - --disable-debug
      - --enable-pic
      - --enable-gnutls
    sources:
      - type: git
        url: https://git.ffmpeg.org/ffmpeg.git
        tag: n9.0.2
    cleanup:
      - /share/ffmpeg

  - name: libplacebo
    buildsystem: meson
    config-opts:
      - -Dvulkan=disabled
      - -Dopengl=disabled
      - -Ddemos=false
      - -Dtests=false
    sources:
      - type: git
        url: https://github.com/haasn/libplacebo.git
        tag: v7.387.0

  - name: libass
    buildsystem: autotools
    sources:
      - type: git
        url: https://github.com/libass/libass.git
        tag: 0.17.5

  - name: mpv
    buildsystem: meson
    config-opts:
      - -Dauto_features=disabled
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dlua=disabled
      - -Dpulse=enabled
      - -Diconv=enabled
      - -Dzlib=enabled
      - -Dbuild-date=false
      - -Dgl=disabled
    sources:
      - type: git
        url: https://github.com/mpv-player/mpv.git
        tag: v0.42.0

  - name: libsecret
    buildsystem: meson
    config-opts:
      - -Dgtk_doc=false
      - -Dmanpage=false
      - -Dintrospection=false
      - -Dvapi=false
    sources:
      - type: git
        url: https://gitlab.gnome.org/GNOME/libsecret.git
        tag: 0.21.8.2

  - name: node
    buildsystem: simple
    build-commands:
      - |
        base=https://nodejs.org/dist/latest-v26.x
        curl -fsSL "$base/SHASUMS256.txt" -o SHASUMS256.txt
        file=$(grep -o 'node-v[0-9.]*-linux-x64\.tar\.gz' SHASUMS256.txt | head -n1)
        curl -fsSL "$base/$file" -o "$file"
        grep " $file\$" SHASUMS256.txt | sha256sum -c -
        tar -xzf "$file" --strip-components=2 --wildcards '*/bin/node'
        install -Dm755 node /app/bin/node
        /app/bin/node -v

  - name: python-deps
    buildsystem: simple
    build-commands:
      - pip3 install --no-cache-dir --prefix=/app --upgrade ytmusicapi "yt-dlp[default]" secretstorage

  - name: media-player
    buildsystem: simple
    build-options:
      env:
        DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
        DOTNET_NOLOGO: '1'
        PLAYER_NIX: '1'
        QtDir: /run/build/media-player/qt-sdk
        CMAKE_PREFIX_PATH: /run/build/media-player/qt-sdk:/usr
        QT_NO_PRIVATE_MODULE_WARNING: 'ON'
    build-commands:
      - mkdir -p /run/build/media-player/qt-sdk/lib
      - ln -s /usr/lib/x86_64-linux-gnu/cmake /run/build/media-player/qt-sdk/lib/cmake
      - ln -s /usr/include /run/build/media-player/qt-sdk/include
      - ln -s /usr/lib/x86_64-linux-gnu /run/build/media-player/qt-sdk/lib/x86_64-linux-gnu

      - >-
        dotnet publish src/Player.App/Player.App.csproj --nologo
        -c Release -r linux-x64 --self-contained false
        -p:PublishReadyToRun=false -p:UseAppHost=true -p:DebugType=None
        -o /app/lib/player

      - |
        root=$(dirname "$(readlink -f "$(which dotnet)")")
        mkdir -p /app/lib/dotnet
        cp -r "$root/host" "$root/shared" "$root/dotnet" /app/lib/dotnet/
        ln -s ../lib/dotnet/dotnet /app/bin/dotnet

      - |
        d=src/Player.App/bin/Release/net10.0/linux-x64
        for f in player_app Application qt_bridge_metadata.json qtdeploy.txt; do
          if [ -e "$d/$f" ]; then cp -r "$d/$f" /app/lib/player/; fi
        done

      - install -Dm755 media-player.sh /app/bin/media-player
      - mkdir -p /app/share/player
      - cp -r sidecar /app/share/player/
      - python3 -m compileall -o 1 /app/share/player/sidecar
      - install -Dm644 flatpak/io.github.Theneillsaaco.MediaPlayer.desktop /app/share/applications/io.github.Theneillsaaco.MediaPlayer.desktop
      - install -Dm644 flatpak/io.github.Theneillsaaco.MediaPlayer.metainfo.xml /app/share/metainfo/io.github.Theneillsaaco.MediaPlayer.metainfo.xml
      - install -Dm644 flatpak/io.github.Theneillsaaco.MediaPlayer.svg /app/share/icons/hicolor/scalable/apps/io.github.Theneillsaaco.MediaPlayer.svg
    sources:
      - type: dir
        path: ..
        skip: [.git, .github, .direnv, .idea, bin, obj, result, tests, docs, flatpak/.flatpak-builder, flatpak/build-dir]
      - type: script
        dest-filename: media-player.sh
        commands:
          - exec /app/lib/player/Player.App "$@"
    